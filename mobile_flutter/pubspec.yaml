name: mobile_flutter
description: "Adhira mobile frontend in Flutter (Android-first)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  just_audio: ^0.10.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  supabase_flutter: ^2.3.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
